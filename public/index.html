<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NABD Gold AI | Institutional Trading Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-dark: #070a12; --card-bg: #101726; --gold: #f3ba2f; --green: #02c076; --red: #f84960; }
        body { background-color: var(--bg-dark); color: #e1e3e6; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card-pro { background: var(--card-bg); border: 1px solid #1a263d; border-radius: 12px; }
        .gold-glow { color: var(--gold); text-shadow: 0 0 10px rgba(243, 186, 47, 0.3); }
        .tf-badge { padding: 6px 12px; border-radius: 6px; font-weight: bold; background: #1a263d; }
        .tf-bull { border-right: 3px solid var(--green); color: var(--green); }
        .tf-bear { border-right: 3px solid var(--red); color: var(--red); }
    </style>
</head>
<body class="p-3">
    <!-- الشريط العلوي -->
    <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom border-secondary">
        <h3 class="m-0"><i class="fa-solid fa-brain text-warning me-2"></i>NABD <span class="gold-glow">GOLD PULSE AI</span></h3>
        <span id="news-status" class="badge bg-danger p-2"><i class="fa-solid fa-bullhorn me-1"></i> رادار الأخبار مفعل</span>
    </div>

    <!-- كروت التحليل والقرار -->
    <div class="row g-3 mb-3">
        <div class="col-md-3">
            <div class="card card-pro p-3 text-center">
                <small class="text-muted">القرار الموحد للذكاء الاصطناعي</small>
                <h4 id="ai-decision" class="text-warning mt-2">WAITING...</h4>
                <small id="ai-confidence" class="text-info">درجة التوافق: 0%</small>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card card-pro p-3">
                <small class="text-muted mb-2 d-block">تحليل الاتجاه الشمعي الفوري (Multi-Timeframe Analysis)</small>
                <div class="row text-center g-2">
                    <div class="col-3"><div id="tf-m5" class="tf-badge tf-bull">5M: ---</div></div>
                    <div class="col-3"><div id="tf-m15" class="tf-badge tf-bull">15M: ---</div></div>
                    <div class="col-3"><div id="tf-h1" class="tf-badge tf-bull">1H: ---</div></div>
                    <div class="col-3"><div id="tf-h4" class="tf-badge tf-bull">4H: ---</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- شارت TradingView التفاعلي العالمي المتكامل -->
    <div class="card card-pro p-2 mb-3" style="height: 550px;">
        <div id="tradingview_gold" style="height: 100%; width: 100%;"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        // تضمين منصة TradingView العالمية المباشرة للذهب
        new TradingView.widget({
            "autosize": true,
            "symbol": "OANDA:XAUUSD",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_gold"
        });

        // تحديث البيانات الحية من السيرفر
        async function fetchState() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                
                document.getElementById('ai-decision').innerText = data.aiDecision;
                document.getElementById('ai-confidence').innerText = "درجة التوافق: " + data.confidence;
                document.getElementById('tf-m5').innerText = "5M: " + data.timeframes.M5;
                document.getElementById('tf-m15').innerText = "15M: " + data.timeframes.M15;
                document.getElementById('tf-h1').innerText = "1H: " + data.timeframes.H1;
                document.getElementById('tf-h4').innerText = "4H: " + data.timeframes.H4;
                if(data.newsAlert) document.getElementById('news-status').innerText = data.newsAlert;
            } catch(e){}
        }
        setInterval(fetchState, 3000);
    </script>
</body>
</html>
