name: NABD agentic isolated tests
on:
  push:
    branches:
      - experimental/nabd-agentic-ai-test
  pull_request:
    paths:
      - 'agentic-experimental/mt5-demo-sensor.mjs'
      - 'agentic-experimental/mt5-demo-readonly-sensor.py'
      - 'agentic-experimental/run-mt5-demo-continuous.py'
      - 'agentic-experimental/test_mt5_demo_continuous.py'
      - 'agentic-experimental/demo-ingest.test.mjs'
      - 'agentic-experimental/live-calendar-stream.mjs'
      - 'agentic-experimental/live-calendar-stream.test.mjs'
      - 'agentic-experimental/phase4-decision-risk.mjs'
      - 'agentic-experimental/phase4-decision-risk.test.mjs'
      - 'agentic-experimental/phase5-decision-audit.mjs'
      - 'agentic-experimental/phase5-decision-audit.test.mjs'
      - 'agentic-experimental/phase6-forward-evaluation.mjs'
      - 'agentic-experimental/phase6-forward-evaluation.test.mjs'
      - 'agentic-experimental/phase7-strategy-comparison.mjs'
      - 'agentic-experimental/phase7-strategy-comparison.test.mjs'
      - 'agentic-experimental/phase8-durable-forward.mjs'
      - 'agentic-experimental/phase8-durable-forward.test.mjs'
      - 'agentic-experimental/phase9-quality-monitor.mjs'
      - 'agentic-experimental/phase9-quality-monitor.test.mjs'
      - 'agentic-experimental/phase10-incident-monitor.mjs'
      - 'agentic-experimental/phase10-incident-monitor.test.mjs'
      - 'agentic-experimental/research-journal-pg.mjs'
      - 'agentic-experimental/research-journal.integration.test.mjs'
      - 'agentic-experimental/sql/001_research_journal.sql'
      - 'agentic-experimental/research-brain.mjs'
      - 'agentic-experimental/research-brain-diagnostics.test.mjs'
      - 'agentic-experimental/NABD_Demo_Trade_Executor_Safe_v1_24.mq5'
      - 'agentic-experimental/demo-executor-source.test.mjs'
      - 'agentic-experimental/NABD_DEMO_EXECUTOR_SAFE_v1_24_INSTALL_AR.md'
      - 'agentic-experimental/demo-trade-intents.mjs'
      - 'agentic-experimental/demo-trade-intents.test.mjs'
      - 'agentic-experimental/fusion-evidence.mjs'
      - 'agentic-experimental/fusion-evidence.test.mjs'
      - 'agentic-experimental/demo-auto-brain.mjs'
      - 'agentic-experimental/render-connectivity-server.mjs'
      - 'agentic-experimental/shadow-feed-runner.mjs'
      - 'agentic-experimental/shadow-feed-rate-limit.test.mjs'
      - 'agentic-experimental/shadow-pipeline.mjs'
      - 'agentic-experimental/shadow-pipeline.test.mjs'
      - 'agentic-experimental/shadow-smoke.mjs'
      - 'agentic-experimental/test_mt5_demo_sensor.py'
      - '.github/workflows/nabd-agentic-isolated.yml'
  workflow_dispatch:
jobs:
  isolated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test experimental adapters only
        run: node --test agentic-experimental/*.test.mjs
      - name: Check isolated Windows DEMO sensor syntax
        run: python3 -m py_compile agentic-experimental/mt5-demo-readonly-sensor.py agentic-experimental/mt5-demo-upload.py agentic-experimental/run-mt5-demo-once.py agentic-experimental/run-mt5-demo-continuous.py agentic-experimental/export-mt5-history-2y.py
      - name: Test isolated Windows DEMO sensor guards with mocked broker
        run: python3 -m unittest discover -s agentic-experimental -p 'test_mt5_demo_*.py' -v

  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: nabd_agentic_research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d nabd_agentic_research_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      NABD_TEST_RESEARCH_DATABASE_URL: postgresql://test_user:ci_only_password@localhost:5432/nabd_agentic_research_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked pg dependencies
        run: npm ci --omit=dev
      - name: Test journal against isolated real PostgreSQL
        run: node --test agentic-experimental/research-journal.integration.test.mjs
