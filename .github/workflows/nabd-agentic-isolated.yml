name: NABD agentic isolated tests
on:
  push:
    branches:
      - experimental/nabd-agentic-ai-test
  workflow_dispatch:
jobs:
  isolated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test experimental adapters only
        run: node --test agentic-experimental/*.test.mjs
