name: NABD member portal production smoke
on:
  push:
    branches: [main]
    paths:
      - 'public/accounts.html'
      - 'public/portal-premium.css'
      - 'server.mjs'
      - '.github/workflows/portal-production-smoke.yml'
  workflow_dispatch:
jobs:
  verify-account-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check premium member portal and unchanged landing/terminal
        run: |
          python3 - <<'PY'
          import time
          import json
          from urllib.request import urlopen
          base='https://gold-pulse-ai.onrender.com'
          expected={
            '/auth': [b'portal-premium.css?v=20261104',b'member-login',b'member-register'],
            '/account': [b'portal-premium.css?v=20261104',b'member-mt5-form'],
            '/admin': [b'portal-premium.css?v=20261104',b'admin-users'],
            '/privacy': [b'portal-premium.css?v=20261104',b'privacy-copy'],
            '/portal-premium.css': [b'#0f766e',b'data-nabd-theme="dark"',b'Mobile portal: keep navigation'],
            '/': [b'DEMO PREVIEW',b'href="/dashboard"'],
            '/dashboard': [b'id="market-symbols"',b'dashboard-theme-choice'],
          }
          for attempt in range(24):
              try:
                  for path,markers in expected.items():
                      with urlopen(base+path,timeout=12) as response:
                          if response.status!=200: raise RuntimeError(f'{path}: {response.status}')
                          data=response.read(250000)
                      for marker in markers:
                          if marker not in data: raise RuntimeError(f'{path}: missing {marker!r}')
                  with urlopen(base+'/healthz',timeout=12) as response:
                      health=json.load(response)
                  if health.get('ok') is not True: raise RuntimeError('/healthz not ok')
                  print('Portal auth/account/admin/privacy, shared theme, landing, dashboard and health pass')
                  break
              except Exception as err:
                  if attempt==23: raise
                  print('Waiting for production deployment:',type(err).__name__)
                  time.sleep(12)
          PY
