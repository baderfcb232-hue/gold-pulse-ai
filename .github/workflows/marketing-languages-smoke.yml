name: NABD bilingual marketing smoke
on:
  push:
    branches: [main]
    paths:
      - 'public/landing.html'
      - 'public/landing-en.html'
      - 'public/marketing-i18n.css'
      - 'public/language-pref.js'
      - 'server.mjs'
      - '.github/workflows/marketing-languages-smoke.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Verify Arabic, English, dashboard and health routes
        run: |
          python3 - <<'PY'
          import time
          from urllib.request import urlopen
          base='https://gold-pulse-ai.onrender.com'
          checks={
            '/':[b'lang="ar" dir="rtl"',b'data-lang-target="en"',b'language-pref.js?v=2'],
            '/en':[b'lang="en" dir="ltr"',b'data-lang-target="ar"',b'language-pref.js?v=2',b'Trading involves risk'],
            '/marketing-i18n.css':[b'.nav-language'],
            '/language-pref.js':[b'nabd-marketing-language',b'nabd:dashboard:language'],
            '/dashboard':[b'id="market-symbols"'],
            '/healthz':[b'"ok":true']
          }
          for n in range(20):
            try:
              for path,markers in checks.items():
                with urlopen(base+path,timeout=12) as response:
                  if response.status!=200:raise RuntimeError(path)
                  html=response.read(200000)
                for marker in markers:
                  if marker not in html:raise RuntimeError(path+' missing marker')
              print('NABD bilingual marketing and unchanged dashboard passed')
              break
            except Exception:
              if n==19:raise
              time.sleep(12)
          PY
