name: NABD V2 browser accessibility, mobile and offline QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.mjs'
      - 'scripts/v2-browser-qa.mjs'
      - '.github/workflows/v2-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.mjs'
      - 'scripts/v2-browser-qa.mjs'
      - '.github/workflows/v2-browser-qa.yml'
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install test-only Chromium tooling (not a production dependency)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate responsive Arabic/English pages, dark/light, PWA and safe offline state
        run: node scripts/v2-browser-qa.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabd-v2-browser-qa
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
