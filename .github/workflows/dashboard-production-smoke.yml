name: NABD dashboard terminal production smoke
on:
  push:
    branches: [main]
    paths:
      - 'public/dashboard-terminal.css'
      - 'public/dashboard-themes.css'
      - 'public/dashboard-fixes.css'
      - 'public/dashboard-contrast-v2.css'
      - 'public/market-loaders.css'
      - 'public/market-loaders.js'
      - 'public/live-feedback.css'
      - 'public/toast-ui.js'
      - 'public/price-feedback.js'
      - 'public/mini-spark.js'
      - 'public/app.js'
      - 'public/mini-spark.js'
      - 'public/dashboard-locale.js'
      - 'public/i18n-core.js'
      - 'public/i18n-dom.js'
      - 'public/dashboard-static-en.js'
      - 'public/account-static-en.js'
      - 'public/attribute-static-en.js'
      - 'public/runtime-status-en.js'
      - 'public/live-status-en.js'
      - 'public/app-extra-en.js'
      - 'public/safety-status-en.js'
      - 'public/server-status-en.js'
      - 'public/signal-date-filter.js'
      - 'public/live.js'
      - 'public/theme-init.js'
      - 'public/nabd-locale-init.js'
      - 'public/nabd-ltr-brand.css'
      - 'public/nabd-logo.svg'
      - 'public/nabd-logo-en.svg'
      - 'public/icon.svg'
      - 'public/index.html'
      - 'server.mjs'
      - '.github/workflows/dashboard-production-smoke.yml'
  workflow_dispatch:
jobs:
  verify-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Confirm live dashboard, styling, homepage and health
        run: |
          python3 - <<'PY'
          import time
          from urllib.request import urlopen
          base='https://gold-pulse-ai.onrender.com'
          checks={
            '/': [b'DEMO PREVIEW', b'href="/dashboard"'],
            '/dashboard': [b'id="market-symbols"', b'/dashboard-terminal.css?v=phase3-1', b'dashboard-theme-choice', b'/dashboard-themes.css?v=premium-1',b'dashboard-fixes.css?v=ux-20261104',b'dashboard-contrast-v2.css?v=20261104',b'market-loaders.css?v=v2-1',b'live-feedback.css?v=v2-1',b'nabd-ltr-brand.css?v=v2-1',b'nabd-logo-en.svg?v=v2-1',b'nabd-toast-history-list',b'dashboard-locale.js?v=v2-i18n-3',b'mini-market-card',b'signal-date-filter',b'trade-sizing-lot'],
            '/dashboard-fixes.css': [b'.toast.error',b'.broker-quote-values>span:first-child',b'.mini-market-card'],
            '/dashboard-contrast-v2.css': [b'--nabd-notice-error-bg',b'.toast-stack',b'.broker-quote-values>span:first-child'],
            '/market-loaders.css': [b'nabd-skeleton-shimmer',b'prefers-reduced-motion'],
            '/market-loaders.js': [b'createMarketLoaders',b'timeoutMs=8000'],
            '/live-feedback.css': [b'nabd-toast-arrive',b'prefers-reduced-motion'],
            '/nabd-ltr-brand.css': [b'html[dir="ltr"] .nav{left:22px;right:auto}',b'html[dir="ltr"] .main{margin-left:200px'],
            '/nabd-locale-init.js': [b'nabd:dashboard:language',b'document.documentElement.dir'],
            '/nabd-logo-en.svg': [b'NABD',b'#0F766E'],
            '/icon.svg': [b'<svg',b'#D4A24C'],
            '/price-feedback.js': [b'priceMovement',b'createPriceFeedback'],
            '/toast-ui.js': [b'createToastCenter',b'eventKey'],
            '/mini-spark.js': [b'sparklineGeometry',b'initMiniSparkline'],
            '/dashboard-locale.js': [b'dashboard-language-choice',b'nabd:dashboard:language',b'translateStaticUi'],
            '/i18n-core.js': [b'SUPPORTED_LOCALES',b'rejectionText'],
            '/i18n-dom.js': [b'translateStaticUi',b'observeLocaleUi',b'setLocalizedText'],
            '/dashboard-static-en.js': [b'dashboardStaticEnglish',b'Market overview'],
            '/app-extra-en.js': [b'appExtraEnglish',b'MT5'],
            '/server-status-en.js': [b'serverStatusEnglish',b'MT5'],
            '/signal-date-filter.js': [b'inSignalDateRange',b'Asia/Gaza'],
            '/dashboard-themes.css': [b'--bg:#f8fafc',b'data-nabd-theme="light"',b'Mobile phase: keep dashboard navigation'],
            '/theme-init.js': [b'nabd:dashboard:theme',b'localStorage'],
            '/dashboard-terminal.css': [b'--bg:#0b1015',b'prefers-reduced-motion'],
            '/healthz': [b'"ok":true'],
          }
          for i in range(20):
              try:
                  for path,markers in checks.items():
                      with urlopen(base+path,timeout=12) as response:
                          if response.status!=200:
                              raise RuntimeError(f'{path}: HTTP {response.status}')
                          content=response.read(200000)
                      for marker in markers:
                          if marker not in content:
                              raise RuntimeError(f'{path} missing expected marker')
                  print('NABD production dashboard CSS, homepage and health OK.')
                  break
              except Exception as error:
                  if i==19: raise
                  print('Deploy readiness retry',i+1,type(error).__name__)
                  time.sleep(12)
          PY
