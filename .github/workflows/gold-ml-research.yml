name: NABD Gold ML shadow research
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gold_ml_walkforward.py'
      - 'scripts/gold-ml-requirements.txt'
      - '.github/workflows/gold-ml-research.yml'
  workflow_dispatch:
jobs:
  research-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/gold-ml-requirements.txt
      - name: Install isolated research-only Python packages
        run: python -m pip install --requirement scripts/gold-ml-requirements.txt
      - name: Verify Python syntax
        run: python -m py_compile scripts/gold_ml_walkforward.py
      - name: Smoke-test chronological folds on synthetic candles only
        run: |
          python scripts/gold_ml_walkforward.py --synthetic-smoke > gold-ml-synthetic-smoke.json
          python - <<'PY'
          import json
          r=json.load(open('gold-ml-synthetic-smoke.json'))
          assert r['production_eligible'] is False
          assert r['dataset']=='SYNTHETIC_SMOKE_NOT_REAL_PRICES'
          assert len(r['folds'])==3
          assert all(f['train_rows']>400 and f['test_rows']>=150 for f in r['folds'])
          assert all(f['test_start']>f['train_end'] for f in r['folds'])
          print('PASS: XGBoost research pipeline, 3 purged chronological folds, no execution')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-ml-synthetic-smoke-not-trading-evidence
          path: gold-ml-synthetic-smoke.json
          retention-days: 14
