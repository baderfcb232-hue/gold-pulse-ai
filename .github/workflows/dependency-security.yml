name: NABD dependency security audit
on:
  push:
    branches:
      - security/npm-audit-20261024
  pull_request:
    branches:
      - main
jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rebuild NodeMailer-only lock entry for security review
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --save-exact nodemailer@10.2.1
          node -e "console.log('NODEMAILER_LOCK_ENTRY '+JSON.stringify(require('./package-lock.json').packages['node_modules/nodemailer']))"
      - name: Install locked dependencies safely
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify all application tests
        run: npm test
