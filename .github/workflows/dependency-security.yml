name: NABD dependency security audit
on:
  push:
    branches:
      - security/npm-audit-20261024
  pull_request:
    branches:
      - main
jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies safely
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify all application tests
        run: npm test
