name: NABD V2 iOS Safari and Android browser emulation
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.mjs'
      - 'scripts/v2-mobile-webkit-qa.mjs'
      - '.github/workflows/v2-mobile-webkit-qa.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.mjs'
      - 'scripts/v2-mobile-webkit-qa.mjs'
      - '.github/workflows/v2-mobile-webkit-qa.yml'
  workflow_dispatch:
jobs:
  mobile-emulation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install browser engines for test only
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps webkit chromium
      - name: Verify mobile Arabic English layouts, accessibility and PWA assets
        run: node scripts/v2-mobile-webkit-qa.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabd-v2-mobile-webkit-results
          path: qa-device-artifacts/
          if-no-files-found: ignore
          retention-days: 7
