name: NABD landing production smoke
on:
  push:
    branches: [main]
    paths:
      - 'public/landing.html'
      - 'public/landing-en.html'
      - 'public/manifest.webmanifest'
      - 'public/pwa-register.js'
      - 'public/sw.js'
      - 'public/offline.html'
      - 'public/nabd-app-icon-192.png'
      - 'public/nabd-app-icon-512.png'
      - 'public/nabd-apple-touch-180.png'
      - 'public/nabd-mark.svg'
      - 'public/marketing-i18n.css'
      - 'public/market-motion.css'
      - 'public/language-pref.js'
      - 'public/landing.css'
      - 'server.mjs'
      - '.github/workflows/landing-production-smoke.yml'
  workflow_dispatch:
jobs:
  verify-public-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Verify deployed public landing and existing dashboard
        run: |
          python3 - <<'PY'
          import time
          from urllib.request import Request, urlopen
          base = 'https://gold-pulse-ai.onrender.com'
          expected = {
            '/': (b'<html lang="ar" dir="rtl">',b'DEMO PREVIEW',b'href="/dashboard"',b'mobile-menu',b'nabd-mark.svg?v=v2-1',b'market-motion.css?v=motion-1',b'market-motion-label'),
            '/welcome': (b'<html lang="ar" dir="rtl">',b'DEMO PREVIEW',b'href="/dashboard"',b'mobile-menu'),
            '/en': (b'<html lang="en" dir="ltr">',b'mobile-menu',b'href="/dashboard"',b'nabd-mark.svg?v=v2-1'),
            '/marketing-i18n.css': (b'.mobile-menu nav',b'@media(max-width:920px)'),
            '/market-motion.css': (b'nabd-market-pulse-draw',b'prefers-reduced-motion'),
            '/language-pref.js': (b'menu.open=false',b'localStorage'),
            '/nabd-mark.svg': (b'<svg',b'#0F766E',b'#D4A24C'),
            '/manifest.webmanifest': (b'nabd-app-icon-192.png',b'nabd-app-icon-512.png',b'standalone'),
            '/sw.js': (b'nabd-offline-shell-v2',b"fetch(req,{cache:'no-store'})",b"url.pathname.startsWith('/api/')"),
            '/offline.html': (b'Offline',b'MT5'),
            '/nabd-app-icon-192.png': (b'PNG',),
            '/nabd-app-icon-512.png': (b'PNG',),
            '/nabd-apple-touch-180.png': (b'PNG',),
            '/landing.css?v=phase2-1': (b'.hero-visual',b'prefers-reduced-motion'),
            '/dashboard': (b'id="market-symbols"', b'/app.js'),
          }
          for attempt in range(20):
              try:
                  for path, markers in expected.items():
                      with urlopen(Request(base+path,headers={'User-Agent':'NABD-landing-smoke/1.0'}),timeout=12) as response:
                          if response.status != 200:
                              raise RuntimeError(f'{path} responded {response.status}')
                          data=response.read(200000)
                      for marker in markers:
                          if marker not in data:
                              raise RuntimeError(f'{path} missing expected marker {marker!r}')
                  with urlopen(base+'/healthz',timeout=12) as response:
                      import json
                      status=json.load(response)
                  if status.get('ok') is not True:
                      raise RuntimeError('healthz did not report ok')
                  print('NABD landing route, stylesheet, existing MT5 dashboard and server health passed.')
                  break
              except Exception as exc:
                  if attempt == 19:
                      raise
                  print(f'Deploy readiness retry {attempt+1}: {type(exc).__name__}: {exc}', flush=True)
                  time.sleep(12)
          PY
