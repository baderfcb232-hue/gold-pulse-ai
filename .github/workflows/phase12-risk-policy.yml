name: NABD phase 12 isolated risk policy
on:
  pull_request:
    paths:
      - 'automatic-risk.mjs'
      - 'automatic-risk.test.mjs'
      - 'risk-control-policy.mjs'
      - 'risk-control-policy.test.mjs'
      - 'risk-center-readonly.test.mjs'
      - 'public/risk-control-center.html'
      - 'public/risk-control-center.js'
      - 'public/risk-control-center.css'
      - 'server.mjs'
      - 'risk-preferences.mjs'
      - 'risk-preferences.test.mjs'
      - 'risk-preferences-ui.test.mjs'
      - 'public/risk-preferences-ui.js'
      - 'auth-store.mjs'
      - 'auth.mjs'
      - 'auth-backup.mjs'
      - 'tests/accounts.test.mjs'
      - '.github/workflows/phase12-risk-policy.yml'
  workflow_dispatch:
jobs:
  isolated-risk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --test automatic-risk.test.mjs risk-control-policy.test.mjs risk-center-readonly.test.mjs risk-preferences.test.mjs risk-preferences-ui.test.mjs tests/accounts.test.mjs
