name: NABD V2 WebKit iPhone browser engine QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.mjs'
      - 'scripts/v2-webkit-qa.mjs'
      - '.github/workflows/v2-webkit-qa.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.mjs'
      - 'scripts/v2-webkit-qa.mjs'
      - '.github/workflows/v2-webkit-qa.yml'
  workflow_dispatch:
jobs:
  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install test-only WebKit browser, not a runtime dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Check touch, layout, i18n, PWA links, and colors in WebKit
        run: node scripts/v2-webkit-qa.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabd-v2-webkit-mobile
          path: qa-webkit-artifacts/
          if-no-files-found: ignore
          retention-days: 7
