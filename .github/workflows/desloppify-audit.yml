name: NABD Desloppify Audit (isolated)

on:
  push:
    branches:
      - test/desloppify-audit

permissions:
  contents: read

concurrency:
  group: desloppify-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-audit:
    if: github.ref == 'refs/heads/test/desloppify-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Desloppify
        run: python -m pip install --upgrade "desloppify[full]"

      - name: Run read-only CI code-quality scan
        shell: bash
        run: |
          set -o pipefail
          mkdir -p audit-results
          desloppify scan --path . --profile ci --no-badge 2>&1 | tee audit-results/scan.log

      - name: Export machine-readable status
        if: always()
        shell: bash
        run: |
          mkdir -p audit-results
          desloppify status --json > audit-results/status.json 2> audit-results/status-error.log || true

      - name: Upload audit reports (no deployments)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabd-desloppify-audit
          path: audit-results/
          if-no-files-found: warn
          retention-days: 14
